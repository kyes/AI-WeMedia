# 定时发布任务
# 对应流程步骤10：自动发布
# 根据自媒体平台以及账号的用户属性，按发布策略定时发布内容

name: 定时发布
description: 按照各平台最佳发布时间窗口，自动发布已通过人工审核的内容到对应自媒体平台
cron: "0 9,12,18,21 * * *"  # 每天9:00、12:00、18:00、21:00执行（覆盖各平台高流量时段）
timezone: Asia/Shanghai

agent: 平台专属Agent（墨微/墨知/墨红/墨推/墨拍）
dependencies:
  - 已审核通过的待发布内容队列
  - 各平台发布策略配置（最佳时间、频率限制）
  - 各平台登录态（Chrome Profile / Cookie）
  - VNC + CDP 浏览器自动化环境

outputs:
  - 发布结果日志（成功/失败状态、发布链接）
  - 发布失败告警通知

prompt_file: ../prompts/03-定时发布-prompt.md

notes: |
  重要：只发布已经通过人工审核确认的内容。
  发布频率需模拟真人操作间隔，避免触发平台风控。
  对于无API的平台（小红书、抖音等），通过VNC+CDP方式操作浏览器完成发布。
