# 数据日报生成定时任务
# 来源：PDF方案中运营总监Agent（墨媒）的每日汇总职责
# 以及功能说明书中数据洞察报告生成功能

name: 数据日报生成
description: 每日汇总各平台运营数据，生成全局数据日报，提炼核心数据结论、存在问题及优化建议
cron: "0 23 * * *"  # 每天晚上23:00执行（在各项监控完成后）
timezone: Asia/Shanghai

agent: 墨媒（运营总监Agent）
dependencies:
  - 当日热点话题抓取结果
  - 当日内容发布记录及效果数据
  - 当日账号信息监控报告
  - 当日内容运营监控报告
  - 当日用户运营监控报告

outputs:
  - 全局数据日报（含各平台核心指标汇总）
  - 当日运营亮点与问题总结
  - 次日运营行动建议清单
  - 通知推送至微信群/钉钉群

prompt_file: ../prompts/07-数据日报生成-prompt.md
