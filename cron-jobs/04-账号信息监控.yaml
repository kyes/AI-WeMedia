# 账号信息监控定时任务
# 对应流程步骤11：账号信息监控
# 通过自媒体平台接口读取账户信息，然后根据账号评估检测表进行分析

name: 账号信息监控
description: 定时采集各自媒体平台账号数据，根据账号检测指标表进行综合评估分析，输出账号健康度报告
cron: "0 21 * * *"  # 每天晚上21:00执行
timezone: Asia/Shanghai

agent: 墨风（数据分析Agent）
dependencies:
  - 各自媒体平台数据接口（粉丝数、关注数、作品数、账号状态等）
  - 账号检测指标表（参考：https://www.kdocs.cn/l/cvNuHE2Us0Nr）
  - 历史账号数据（用于趋势对比）

outputs:
  - 账号健康度评分报告
  - 各平台账号关键指标汇总（粉丝增减、违规状态、限流预警等）
  - 异常告警通知（如粉丝骤降、账号限流等）

prompt_file: ../prompts/04-账号信息监控-prompt.md
