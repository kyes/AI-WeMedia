# 用户运营监控定时任务
# 对应流程步骤13：用户运营监控
# 针对不同的自媒体平台，根据用户行为数据，分析内容的优化方向

name: 用户运营监控
description: 定时采集各平台用户行为数据，分析粉丝画像变化、互动趋势、用户留存，输出用户运营优化建议
cron: "30 22 * * *"  # 每天晚上22:30执行
timezone: Asia/Shanghai

agent: 墨风（数据分析Agent）
dependencies:
  - 各自媒体平台用户数据接口（粉丝画像、互动行为、关注/取关数据等）
  - 用户分层模型配置
  - 历史用户数据（用于趋势对比）

outputs:
  - 用户画像变化报告（新增粉丝画像、流失粉丝特征）
  - 粉丝增长/流失趋势分析
  - 用户互动行为分析（评论情绪、互动高峰时段）
  - 用户运营优化建议（互动策略、触达策略调整）

prompt_file: ../prompts/06-用户运营监控-prompt.md
