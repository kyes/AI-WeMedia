# 内容运营监控定时任务
# 对应流程步骤12：内容运营监控
# 针对不同的自媒体平台，根据作品的标题、内容、以及运营数据，分析内容的优化方向

name: 内容运营监控
description: 定时采集各平台已发布内容的运营数据，分析内容效果，识别爆款内容与低效内容，输出内容优化建议
cron: "0 22 * * *"  # 每天晚上22:00执行
timezone: Asia/Shanghai

agent: 墨风（数据分析Agent）
dependencies:
  - 各自媒体平台内容数据接口（阅读/播放量、点赞、评论、转发、收藏等）
  - 已发布内容记录（标题、内容、发布时间、平台）
  - 历史内容数据（用于趋势对比）

outputs:
  - 内容效果排行榜（按互动率、曝光量排序）
  - 爆款内容特征分析报告
  - 低效内容问题诊断及优化建议
  - 内容题材/形式/风格优化方向

prompt_file: ../prompts/05-内容运营监控-prompt.md
