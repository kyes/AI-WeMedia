# 数据异常预警检测定时任务
# 来源：功能说明书中数据异常预警功能
# 以及PDF方案中运营总监Agent发现异常立即通知的职责

name: 数据异常预警检测
description: 高频次检测各平台核心数据指标，当数据触发预设阈值时实时推送预警信息
cron: "0 */4 * * *"  # 每4小时执行一次（0:00, 4:00, 8:00, 12:00, 16:00, 20:00）
timezone: Asia/Shanghai

agent: 墨媒（运营总监Agent）
dependencies:
  - 各自媒体平台核心数据接口
  - 预设数据阈值配置（粉丝骤降阈值、互动率异常阈值、流量异常阈值等）
  - 历史基线数据（用于异常判断）

outputs:
  - 异常指标检测结果
  - 异常预警通知（通过微信/钉钉/短信推送）
  - 异常原因初步分析及应急建议

prompt_file: ../prompts/08-数据异常预警检测-prompt.md

notes: |
  当检测到爆款内容（数据突增）时，也需要通知人工及时介入做二次传播。
  预警级别分为：紧急（立即通知）、重要（汇总通知）、一般（日报中体现）。
