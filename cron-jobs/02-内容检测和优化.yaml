# 内容检测和优化定时任务
# 对应流程步骤9：内容检测和优化
# 需要去掉AI味和优化内容

name: 内容检测和优化
description: 定时检测待发布内容队列中的内容，进行AI痕迹检测、敏感词检测、原创度检测和内容优化
cron: "0 14 * * *"  # 每天下午14:00执行
timezone: Asia/Shanghai

agent: 墨盾（合规风控Agent）
dependencies:
  - 待发布内容队列
  - 敏感词库
  - 各平台内容规范规则库
  - 原创度检测API

outputs:
  - 内容检测报告（AI痕迹评分、敏感词列表、原创度评分、合规性评分）
  - 优化后的内容版本
  - 需人工复核的内容标记

prompt_file: ../prompts/02-内容检测和优化-prompt.md
