# 热点话题抓取定时任务
# 对应流程步骤7：提取热点新闻内容话题
# 提取跟选题方向相关的热点新闻并生成内容话题列表

name: 热点话题抓取
description: 每日定时扫描全网热点，提取与账号选题方向相关的热点新闻，生成内容话题列表供选题参考
cron: "0 8 * * *"  # 每天早上8:00执行
timezone: Asia/Shanghai

agent: 墨风（数据分析Agent）
dependencies:
  - 账号定位配置（选题方向、领域标签）
  - 各平台热点数据接口（百度指数、抖音热点榜、微博热搜、小红书热门话题等）

outputs:
  - 每日热点话题列表（含话题热度、与账号匹配度评分）
  - 推荐选题方向（TOP 5-10个高匹配度话题）

prompt_file: ../prompts/01-热点话题抓取-prompt.md
